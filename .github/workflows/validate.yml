name: Validate skill and tokens
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        antd: ['5.27.0', '6.0.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm install --ignore-scripts --no-audit --no-fund --no-save antd@${{ matrix.antd }}
      - run: npm run typecheck
